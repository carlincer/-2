<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenWave - 자주 가는 GPS 저장 & 신호등 안내</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f0f4f8; color: #102a43; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    .status-badge { font-size: 0.85rem; background-color: rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 20px; }
    main { flex: 1; position: relative; background-color: #1e293b; }
    
    .top-controls { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 8; align-items: flex-end; }
    .action-btn { background-color: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .action-btn.secondary { background-color: #059669; }
    
    .places-panel { position: absolute; top: 130px; right: 20px; width: 280px; max-height: 300px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-radius: 12px; padding: 16px; color: #f8fafc; z-index: 8; overflow-y: auto; }
    .place-item { background: rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 10px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .place-name { font-weight: 600; font-size: 0.9rem; }
    .place-coords { font-size: 0.75rem; color: #94a3b8; }
    .delete-btn { background: none; border: none; color: #f87171; cursor: pointer; padding: 4px; }
    
    .ai-panel { position: absolute; bottom: 24px; left: 24px; width: 360px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; color: #f8fafc; z-index: 9; }
    .ai-content { font-size: 0.95rem; line-height: 1.5; white-space: pre-line; margin-top: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>🌊 GreenWave</h1>
    <div class="status-badge" id="gpsStatus">GPS 준비 완료</div>
  </header>

  <main>
    <div class="top-controls">
      <button class="action-btn" id="fetchBtn">내 위치 기반 잔여시간 분석</button>
      <button class="action-btn secondary" id="saveBtn">⭐ 현재 위치 자주 가는 곳에 저장</button>
    </div>

    <div class="places-panel">
      <h3 style="color:#34d399; font-size:0.95rem;">📍 자주 가는 장소 (GPS)</h3>
      <div id="placesList">
        <div style="font-size:0.8rem; color:#94a3b8; margin-top:8px;">목록을 불러오는 중...</div>
      </div>
    </div>

    <div class="ai-panel">
      <strong style="color:#60a5fa;">✨ Gemini AI 분석</strong>
      <div class="ai-content" id="aiOutput">버튼을 눌러 현재 위치 또는 저장된 위치의 신호등 예측 정보를 확인하세요.</div>
    </div>
  </main>

  <script type="module">
    import { saveFrequentLocation, subscribeFrequentLocations, deleteFrequentLocation } from './src/firebase.js';

    let currentLat = 37.5547;
    let currentLng = 126.9707;

    subscribeFrequentLocations((locations) => {
      const listEl = document.getElementById('placesList');
      if (locations.length === 0) {
        listEl.innerHTML = '<div style="font-size:0.8rem; color:#94a3b8; margin-top:8px;">저장된 장소가 없습니다.</div>';
        return;
      }

      listEl.innerHTML = '';
      locations.forEach((loc) => {
        const item = document.createElement('div');
        item.className = 'place-item';
        item.innerHTML = `
          <div>
            <div class="place-name">📍 ${loc.name}</div>
            <div class="place-coords">${loc.lat.toFixed(4)}, ${loc.lng.toFixed(4)}</div>
          </div>
          <button class="delete-btn" data-id="${loc.id}">✕</button>
        `;

        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-btn')) return;
          document.getElementById('gpsStatus').innerText = `선택 위치: ${loc.name}`;
          currentLat = loc.lat;
          currentLng = loc.lng;
          fetchTrafficData(loc.lat, loc.lng);
        });

        item.querySelector('.delete-btn').addEventListener('click', async (e) => {
          e.stopPropagation();
          if (confirm(`'${loc.name}' 장소를 삭제하시겠습니까?`)) {
            await deleteFrequentLocation(loc.id);
          }
        });

        listEl.appendChild(item);
      });
    });

    document.getElementById('saveBtn').addEventListener('click', async () => {
      const name = prompt("이 장소의 이름을 입력하세요 (예: 집, 회사, 단골 교차로):", "자주 가는 곳");
      if (!name) return;

      try {
        await saveFrequentLocation(name, currentLat, currentLng);
        alert(`'${name}' GPS 위치가 성공적으로 저장되었습니다!`);
      } catch (err) {
        alert("저장 실패: Firebase 설정을 확인해주세요.");
      }
    });

    document.getElementById('fetchBtn').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            document.getElementById('gpsStatus').innerText = `위치 수신 성공 (${currentLat.toFixed(4)}, ${currentLng.toFixed(4)})`;
            fetchTrafficData(currentLat, currentLng);
          },
          () => fetchTrafficData(currentLat, currentLng),
          { timeout: 10000 }
        );
      } else {
        fetchTrafficData(currentLat, currentLng);
      }
    });

    async function fetchTrafficData(lat, lng) {
      const output = document.getElementById('aiOutput');
      output.innerText = "분석 중입니다...";

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat, lng }),
        });
        const data = await res.json();
        output.innerText = res.ok ? data.result : `오류: ${data.error}`;
      } catch (err) {
        output.innerText = "서버 통신 오류가 발생했습니다.";
      }
    }
  </script>
</body>
</html>
